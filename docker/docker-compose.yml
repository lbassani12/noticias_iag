name: tesina

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
      # addons: el institucional y el de la tesina
      - ../../wsfnoticias:/mnt/extra-addons/wsfnoticias   # rw: escribe medio.log y telegram_norep.db en su carpeta
      - ../:/mnt/extra-addons/noticias_iag
    command: ["odoo", "--dev=reload,qweb,xml"]
    # En el host, Ollama queda accesible como http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
  odoo-data:
