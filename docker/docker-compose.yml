name: tesina

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
      # addons: el institucional y el de la tesina
      - ../../wsfnoticias:/mnt/extra-addons/wsfnoticias   # rw: escribe medio.log y telegram_norep.db en su carpeta
      - ../:/mnt/extra-addons/noticias_iag
    command: ["odoo", "--dev=reload,qweb,xml"]
    # host.docker.internal apunta al host de Docker: el Ollama nativo de Windows, que usa la GPU AMD por Vulkan
    # api.telegram.org -> loopback: wsfnoticias manda cada noticia grabada al grupo
    # institucional con el token hardcodeado del repo base, incluso si la regla no
    # tiene Telegram configurado (fun_enviar_telegrama usa el chat por defecto).
    # En dev se anula la resolución del host para que el POST falle sin salir.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.telegram.org:127.0.0.1"

  # Ollama en contenedor, solo CPU: la GPU AMD (RX 6500M) no es accesible desde WSL ni Docker.
  # El Ollama nativo de Windows con GPU (Vulkan), alcanzable como http://host.docker.internal:11434/v1,
  # se probó el 2026-09-03 y se descartó el 2026-09-04 (la máquina se apagaba bajo carga). El servicio
  # queda bajo un profile para que `docker compose up` no lo levante solo y no choque en el puerto 11434
  # si la app de Windows está corriendo. Configuración vigente:
  #   docker compose --profile docker-ollama up -d ollama
  # y noticias_iag.base_url = http://ollama:11434/v1.
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  ollama-data:
